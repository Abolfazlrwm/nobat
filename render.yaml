# ---------------------------------------------------------------------------
# Render Blueprint — Nobat demo
#
# Deploy with one click:
#   https://render.com/deploy?repo=https://github.com/Abolfazlrwm/nobat
#
# Or from the Render dashboard: New + -> Blueprint -> pick this repository.
# Free plan: service sleeps after 15 min idle, wakes in ~1 minute,
# SQLite database is re-seeded on every boot.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: nobat-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: Nobat
      - key: APP_LOCALE
        value: fa
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_LIFETIME
        value: "240"
      # The demo is served over https — keep session cookies off plain http.
      - key: SESSION_SECURE_COOKIE
        value: "true"
      # Render free logs cost nothing but noise — keep them warning-level.
      - key: LOG_LEVEL
        value: warning
      - key: NOBAT_PAYMENT_DRIVER
        value: zarinpal
      - key: ZARINPAL_SANDBOX
        value: "true"
      # Sandbox merchant — swap for a real merchant id in production.
      - key: ZARINPAL_MERCHANT_ID
        value: "00000000-0000-0000-0000-000000000000"
