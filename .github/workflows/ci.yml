name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: Lint, Pint, Pest & Assets
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: sqlite3
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Validate composer.json (strict)
              run: composer validate --strict

            - name: Install PHP dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: PHP syntax check (php -l on every project PHP file)
              run: |
                  ERR=0
                  while IFS= read -r -d '' f; do
                      php -l "$f" >/dev/null 2>&1 || { echo "SYNTAX FAIL: $f"; php -l "$f" 2>&1 | head -3; ERR=1; }
                  done < <(find . -type f -name '*.php' ! -name '*.blade.php' -not -path './vendor/*' -not -path './node_modules/*' -not -path './.git/*' -print0)
                  exit $ERR

            - name: Install Node dependencies
              run: npm ci

            - name: Code style (ESLint)
              run: npm run lint:check

            - name: Code style (Prettier)
              run: npm run format:check

            - name: Build frontend assets
              run: npm run build

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Code style (Pint)
              run: vendor/bin/pint --test

            - name: Tests (Pest)
              run: php artisan test
