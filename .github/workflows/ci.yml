name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: Lint, Pint, Pest & Assets
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: sqlite3
                  coverage: pcov

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Validate composer.json (strict)
              run: composer validate --strict

            - name: Install PHP dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: PHP syntax check (php -l on every project PHP file)
              run: |
                  ERR=0
                  while IFS= read -r -d '' f; do
                      php -l "$f" >/dev/null 2>&1 || { echo "SYNTAX FAIL: $f"; php -l "$f" 2>&1 | head -3; ERR=1; }
                  done < <(find . -type f -name '*.php' ! -name '*.blade.php' -not -path './vendor/*' -not -path './node_modules/*' -not -path './.git/*' -print0)
                  exit $ERR

            - name: Install Node dependencies
              run: npm ci

            - name: Code style (ESLint)
              run: npm run lint:check

            - name: Code style (Prettier)
              run: npm run format:check

            - name: Build frontend assets
              run: npm run build

            - name: Unit tests (Vitest)
              run: npm run test:unit

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Code style (Pint)
              run: vendor/bin/pint --test

            - name: Static analysis (PHPStan + Larastan)
              run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

            - name: Dependency audit (composer)
              run: composer audit

            - name: Dependency audit (npm, production deps)
              run: npm audit --omit=dev

            - name: Tests (Pest, with coverage)
              run: vendor/bin/pest --coverage --min=85 --coverage-clover=coverage.xml

            - name: Coverage summary
              run: |
                  PCT=$(php -r '$m = simplexml_load_file("coverage.xml")->project->metrics; echo round(100 * $m["coveredstatements"] / max(1, $m["statements"]), 1);')
                  echo "Backend line coverage: **${PCT}%**" >> "$GITHUB_STEP_SUMMARY"

    e2e:
        name: E2E (Playwright)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: sqlite3
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install PHP dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Install Node dependencies
              run: npm ci

            - name: Install Playwright browser
              run: npx playwright install --with-deps chromium

            - name: Build frontend assets
              run: npm run build

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Run E2E suite
              run: npm run test:e2e

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
